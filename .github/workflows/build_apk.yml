name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet telethon python-dotenv qrcode pillow humanize rich requests

      - name: Build Android APK with Flet
        run: |
          flet build apk \
            --project-name "TelegramDownloader" \
            --product-name "Telegram Downloader" \
            --build-version "1.0.0" \
            --build-number 1 \
            --permissions photo_library \
            --android-permissions android.permission.INTERNET=true \
            --android-permissions android.permission.WRITE_EXTERNAL_STORAGE=true \
            --android-permissions android.permission.READ_EXTERNAL_STORAGE=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Downloader-APK
          path: build/apk/*.apk
          if-no-files-found: warn
